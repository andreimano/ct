[project]
name = "ct"
version = "0.1.0"
description = "Dispatch and watch SLURM jobs on several clusters from one machine"
requires-python = ">=3.9"
dependencies = [
  "typer>=0.9",
  "rich>=13",
  "questionary>=2",
  "tomli-w>=1",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
ct = "ct.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ct"]
